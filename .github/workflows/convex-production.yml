name: Convex Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Convex environment to deploy"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - production
  push:
    branches:
      - main
    paths:
      - "convex/**"
      - "src/lib/mock-data.ts"
      - "src/lib/ingestion/**"
      - "src/lib/classification/**"
      - "scripts/refresh-changed-vendors.mjs"
      - "scripts/lib/changed-vendor-refresh.mjs"
      - "scripts/check-vendor-coverage.mjs"
      - "scripts/check-rollback-gate.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/convex-production.yml"

concurrency:
  group: convex-deploy-${{ github.ref }}-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-development:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'development' }}
    name: Deploy Convex development
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: development

    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Convex deploy key
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::CONVEX_DEPLOY_KEY is not configured for the development GitHub environment."
            exit 1
          fi

      - name: Run unit tests
        run: npm test

      - name: Check rollback compatibility gate
        run: npm run rollback:gate

      - name: Deploy Convex development
        run: npx convex deploy --typecheck try

  deploy-production:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') }}
    name: Deploy Convex production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production

    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
      CONVEX_URL: https://joyous-mole-525.convex.cloud

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Convex deploy key
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::CONVEX_DEPLOY_KEY is not configured for the production GitHub environment."
            exit 1
          fi

      - name: Run unit tests
        run: npm test

      - name: Check rollback compatibility gate
        run: npm run rollback:gate

      - name: Deploy Convex production
        run: npx convex deploy --typecheck try

      - name: Rebuild bounded public event statistics
        run: |
          node --input-type=module <<'NODE'
          import { ConvexHttpClient } from "convex/browser";
          import { api } from "./convex/_generated/api.js";

          if (!process.env.ADMIN_SECRET) {
            throw new Error("ADMIN_SECRET is required to rebuild public event statistics.");
          }

          const client = new ConvexHttpClient(process.env.CONVEX_URL);
          const result = await client.action(api.publicStats.rebuild, {
            adminSecret: process.env.ADMIN_SECRET,
          });
          console.log(JSON.stringify(result, null, 2));
          NODE

  production-availability:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') }}
    name: Production HTTP after Convex deploy
    runs-on: ubuntu-latest
    timeout-minutes: 7
    needs: deploy-production

    env:
      CAPACITY_WARNING_RATIO: "0.7"
      MAX_PUBLIC_EVENT_COUNT: "10000"
      PRODUCTION_HTTP_METRICS_PATH: artifacts/production-http-metrics.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Wait for production deploy window
        run: sleep 180

      - name: Check production HTTP availability
        run: npm run http:production

      - name: Upload production HTTP capacity snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-http-metrics-${{ github.run_id }}
          path: artifacts/production-http-metrics.json
          if-no-files-found: ignore
          retention-days: 90

  production-data-quality:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') }}
    name: Production data quality after Convex deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy-production
    environment:
      name: production

    env:
      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
      CONVEX_URL: https://joyous-mole-525.convex.cloud
      EVENT_LIMIT: "24"
      MAX_FUTURE_SKEW_HOURS: "1"
      MAX_LATEST_EVENT_AGE_HOURS: "72"
      MAX_SOURCE_LAG_HOURS: "8"
      MAX_SOURCE_LAG_GRACE_HOURS: "1"
      MAX_SOURCE_LAG_MULTIPLIER: "2"
      MAX_DEGRADED_SOURCE_COUNT: "1"
      MAX_CONSECUTIVE_SOURCE_FAILURES: "1"
      MAX_RECENT_FAILURE_SOURCE_COUNT: "1"
      MAX_RECENT_FAILURES_PER_SOURCE: "1"
      SINCE_HOURS: "8"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate admin secret
        run: |
          if [ -z "$ADMIN_SECRET" ]; then
            echo "::error::ADMIN_SECRET is not configured for the production GitHub environment."
            exit 1
          fi

      - name: Run production due-source refresh
        run: |
          node --input-type=module <<'NODE'
          import { ConvexHttpClient } from "convex/browser";
          import { api } from "./convex/_generated/api.js";

          const client = new ConvexHttpClient(process.env.CONVEX_URL);
          const result = await client.action(api.ingest.runManualIngestion, {
            adminSecret: process.env.ADMIN_SECRET,
            force: false,
          });

          console.log(JSON.stringify(result, null, 2));
          NODE

      - name: Force refresh changed vendors
        if: ${{ github.event_name == 'push' }}
        run: npm run refresh:changed-vendors
        env:
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_HEAD_SHA: ${{ github.sha }}

      - name: Wait for source refreshes
        run: sleep 180

      - name: Run production freshness check
        run: npm run health:production

      - name: Run source link audit
        run: npm run sources:production

      - name: Run vendor coverage audit
        run: npm run vendors:production
